<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKT / IG DM 채팅 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0b0b0e;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang TC","Microsoft JhengHei",sans-serif;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px}

.tabs{display:flex;gap:8px;align-items:center}
.tabs button{
  background:#1c1c22;color:#9a9aa5;border:1px solid #2a2a33;
  padding:8px 20px;border-radius:999px;font-size:13px;cursor:pointer;
  transition:.18s;font-family:inherit;
}
.tabs button.on{background:#fff;color:#111;border-color:#fff}

.trans-toggle{
  background:#1c1c22;color:#9a9aa5;border:1px solid #2a2a33;
  padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;
  transition:.18s;font-family:inherit;display:flex;align-items:center;gap:6px;
  margin-left:6px;
}
.trans-toggle.on{background:#4C8BF5;color:#fff;border-color:#4C8BF5}
.trans-toggle .dot{
  width:8px;height:8px;border-radius:50%;background:#4a4a55;transition:.18s;
}
.trans-toggle.on .dot{background:#fff}

.phone{
  width:390px;height:780px;border-radius:40px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.85),0 0 0 10px #17171c;
  transition:background .25s;
}

.phone.kakao{
  --bg:#B2C7D9; --hdr-bg:#B2C7D9; --hdr-fg:#16181a; --hdr-sub:#4c5b68;
  --npc-bg:#ffffff; --npc-fg:#111111;
  --me-bg:#FEE500; --me-fg:#111111;
  --meta:#5B6B7B; --composer-bg:#B2C7D9; --input-bg:#ffffff;
  --accent:#FEE500;
}
.phone.ig{
  --bg:#000000; --hdr-bg:#000000; --hdr-fg:#ffffff; --hdr-sub:#8e8e8e;
  --npc-bg:#262626; --npc-fg:#ffffff;
  --me-bg:linear-gradient(135deg,#6E4AFF 0%,#3C82FF 100%); --me-fg:#ffffff;
  --meta:#8e8e8e; --composer-bg:#000000; --input-bg:#1c1c1e;
  --accent:#3C82FF;
}

.hdr{
  flex:0 0 auto;background:var(--hdr-bg);color:var(--hdr-fg);
  display:flex;align-items:center;gap:10px;
  padding:16px 14px 12px;
  border-bottom:1px solid rgba(128,128,128,.16);
}
.hdr .back{font-size:26px;line-height:1;opacity:.7;margin-top:-4px;cursor:pointer}
.hdr .avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.hdr .info{flex:1;min-width:0}
.hdr .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:11.5px;color:var(--hdr-sub);margin-top:1px}
.hdr .tag{font-size:9.5px;letter-spacing:.1em;opacity:.5;font-weight:700}

.chat{
  flex:1;background:var(--bg);overflow-y:auto;
  padding:16px 12px 24px;display:flex;flex-direction:column;
}
.chat::-webkit-scrollbar{width:0}

.row{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.row.cont{margin-top:3px}
.row.player{flex-direction:row-reverse}
.row .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.row.cont .av{visibility:hidden}
.row .col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.row.player .col{align-items:flex-end}
.row .sender{font-size:12px;color:var(--hdr-sub);margin-bottom:4px;padding-left:3px}

.line{display:flex;align-items:flex-end;gap:6px}
.row.player .line{flex-direction:row-reverse}

.bubble{
  padding:9px 13px;border-radius:18px;
  font-size:14px;line-height:1.45;word-break:break-word;
  background:var(--npc-bg);color:var(--npc-fg);
  box-shadow:0 1px 2px rgba(0,0,0,.07);
}
.row.player .bubble{background:var(--me-bg);color:var(--me-fg)}
.row.npc:not(.cont) .bubble{border-top-left-radius:6px}
.row.player:not(.cont) .bubble{border-top-right-radius:6px}

.kr{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.zh{font-size:12px;opacity:.6;margin-top:3px;line-height:1.4}

.meta{
  font-size:11px;color:var(--meta);
  display:flex;gap:5px;white-space:nowrap;padding-bottom:3px;
}
.st-read{opacity:.55}
.st-unread{color:#e8a33d;font-weight:600}

.ctx{font-size:11px;opacity:.65;margin-bottom:5px;padding-left:2px}

.reactions{
  margin-top:-8px;background:var(--npc-bg);color:var(--npc-fg);
  border-radius:999px;padding:2px 8px;font-size:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative;z-index:1;
}

.media{width:175px;border-radius:12px;overflow:hidden;margin-bottom:6px;background:rgba(128,128,128,.18)}
.media-thumb{height:105px;background:linear-gradient(135deg,#7B5CFF,#3C82FF)}
.media-cap{font-size:12px;padding:7px 9px;line-height:1.4}

.composer{
  flex:0 0 auto;background:var(--composer-bg);
  padding:10px 12px 18px;display:flex;gap:8px;align-items:center;
  border-top:1px solid rgba(128,128,128,.16);
}
.composer input{
  flex:1;background:var(--input-bg);border:none;outline:none;
  border-radius:20px;padding:11px 15px;font-size:14px;
  color:var(--hdr-fg);font-family:inherit;
}
.composer input::placeholder{color:#8e8e8e}
.composer button{
  background:var(--accent);color:#111;border:none;border-radius:20px;
  padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.phone.ig .composer button{color:#fff}

.typing{font-size:12px;color:var(--hdr-sub);padding:6px 12px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button id="tabKakao" class="on">KakaoTalk</button>
    <button id="tabIg">Instagram DM</button>
    <button id="transToggle" class="trans-toggle on">
      <span class="dot"></span><span id="transLabel">번역 ON</span>
    </button>
  </div>

  <div class="phone kakao" id="phone">
    <div id="hdrSlot"></div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <input id="inp" placeholder="메시지 입력…" autocomplete="off">
      <button id="send">전송</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. 캐릭터 정보
   ============================================================ */
const DATA = {
  kakao: {
    name: '박지민',
    sub:  'KakaoTalk',
    avatar: 'linear-gradient(135deg,#c9d6e2,#9fb3c8)'
  },
  ig: {
    name: '지민 🐰',
    sub:  '@jimin_0fficial',
    avatar: 'linear-gradient(135deg,#FFB86B,#FF5E7E)'
  }
};

/* ============================================================
   2. 초기 대화 (자유롭게 수정하거나 비워도 됨)
   ============================================================ */
let MESSAGES = [
  { id:'m1', side:'npc',    time:'21:03', kr:'오늘 뭐 해?',                    zh:'今天要幹嘛？' },
  { id:'m2', side:'player', time:'21:04', status:'read',   kr:'그냥 집에 있어', zh:'就待在家裡' },
  { id:'m3', side:'npc',    time:'21:05', kr:'심심한데…',                     zh:'好無聊喔……' },
  { id:'m4', side:'npc',    time:'21:05', kr:'나 방금 퇴근했어',               zh:'我剛下班' },
];

/* ============================================================
   3. 전역 변수
   ============================================================ */
let platform = 'kakao';
let isTyping = false;
let showTranslation = localStorage.getItem('showTranslation') !== 'off';

/* ⚠️ 여기에 Gemini API Key 입력 ⚠️ */
const GEMINI_API_KEY = '여기에_API_키_입력';

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 상태 표시 (한국어) */
const statusText = s => ({ sent:'전송됨', unread:'안 읽음', read:'읽음' }[s] || '');

const nowTime = () => {
  const t = new Date();
  return String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
};

/* ============================================================
   4. 렌더 함수
   ============================================================ */
function render() {
  const d = DATA[platform];
  document.getElementById('phone').className = 'phone ' + platform;

  /* 상단 헤더 */
  document.getElementById('hdrSlot').innerHTML = `
    <header class="hdr">
      <div class="back">‹</div>
      <div class="avatar" style="background:${d.avatar}"></div>
      <div class="info">
        <div class="name">${esc(d.name)}</div>
        <div class="sub">${esc(d.sub)}</div>
      </div>
      <div class="tag">${platform === 'kakao' ? 'KAKAO' : 'IG'}</div>
    </header>`;

  /* 번역 토글 버튼 상태 업데이트 */
  const toggle = document.getElementById('transToggle');
  const label = document.getElementById('transLabel');
  if (showTranslation) {
    toggle.classList.add('on');
    label.textContent = '번역 ON';
  } else {
    toggle.classList.remove('on');
    label.textContent = '번역 OFF';
  }

  /* 메시지 렌더링 */
  const chat = document.getElementById('chat');
  let html = '';
  let prevSide = null;

  for (const m of MESSAGES) {
    const cont = prevSide === m.side;
    prevSide = m.side;

    let inner = '';

    if (m.kind === 'story_reply' && platform === 'ig') {
      inner += `<div class="ctx">스토리에 답장함</div>`;
    }

    if (m.kind === 'reel_share' || m.kind === 'post_share') {
      inner += `<div class="media">
        <div class="media-thumb"></div>
        <div class="media-cap">
          ${esc(m.mediaCaption || '')}
          ${m.mediaCaptionZh && showTranslation ? `<div class="zh">${esc(m.mediaCaptionZh)}</div>` : ''}
        </div>
      </div>`;
    }

    if (m.kr) inner += `<div class="kr">${esc(m.kr)}</div>`;
    if (m.zh && showTranslation) inner += `<div class="zh">${esc(m.zh)}</div>`;
    if (!inner) inner = '<div class="kr">·</div>';

    const meta = m.side === 'player'
      ? `<span>${esc(m.time)}</span>` +
        (m.status ? `<span class="st-${m.status}">${statusText(m.status)}</span>` : '')
      : `<span>${esc(m.time)}</span>`;

    html += `
      <div class="row ${m.side}${cont ? ' cont' : ''}">
        ${m.side === 'npc'
          ? `<div class="av" style="background:${d.avatar}"></div>`
          : ''}
        <div class="col">
          ${m.side === 'npc' && !cont
            ? `<div class="sender">${esc(d.name)}</div>`
            : ''}
          <div class="line">
            <div class="bubble">${inner}</div>
            <div class="meta">${meta}</div>
          </div>
          ${m.reactions && m.reactions.length
            ? `<div class="reactions">${m.reactions.join('')}</div>`
            : ''}
        </div>
      </div>`;
  }

  if (isTyping) {
    html += `<div class="typing">입력 중…</div>`;
  }

  chat.innerHTML = html;
  chat.scrollTop = chat.scrollHeight;
}

/* ============================================================
   5. Gemini API 호출
   ============================================================ */
async function callAI(userMessage) {
  if (!GEMINI_API_KEY || GEMINI_API_KEY === '여기에_API_키_입력') {
    alert('코드에 Gemini API Key를 먼저 입력해 주세요!');
    return null;
  }

  const prompt = `너는 한국어 연애 시뮬레이션 캐릭터이고, 이름은 박지민이야. 사용자와 채팅 앱으로 대화하고 있어. 사용자의 말에 자연스러운 한국어로 답장하고, 번역도 함께 제공해. 반드시 다음 형식으로만 답해: 한국어 원문|繁體中文翻譯. 다른 설명은 하지 마. 사용자: ${userMessage}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

  const body = {
    contents: [{
      parts: [{ text: prompt }]
    }]
  };

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
      return data.candidates[0].content.parts[0].text;
    } else {
      console.error('API 응답 오류:', data);
      return '미안, 지금 답장 못 해 😢|抱歉，現在沒辦法回你 😢';
    }
  } catch (err) {
    console.error('API 호출 실패:', err);
    return '미안, 지금 답장 못 해 😢|抱歉，現在沒辦法回你 😢';
  }
}

/* ============================================================
   6. 메시지 전송 + AI 응답
   ============================================================ */
async function send() {
  const inp = document.getElementById('inp');
  const v = inp.value.trim();
  if (!v) return;

  const isKr = /[\uAC00-\uD7AF]/.test(v);
  const playerMsg = {
    id: 'u' + Date.now(),
    side: 'player',
    time: nowTime(),
    status: 'sent'
  };
  playerMsg[isKr ? 'kr' : 'zh'] = v;

  MESSAGES.push(playerMsg);
  inp.value = '';
  render();

  isTyping = true;
  render();

  const aiReplyRaw = await callAI(v);
  if (aiReplyRaw === null) {
    isTyping = false;
    render();
    return;
  }

  let kr = aiReplyRaw;
  let zh = '';
  if (aiReplyRaw.includes('|')) {
    const parts = aiReplyRaw.split('|');
    kr = parts[0].trim();
    zh = parts[1] ? parts[1].trim() : '';
  }

  const lastPlayer = [...MESSAGES].reverse().find(m => m.side === 'player');
  if (lastPlayer) lastPlayer.status = 'read';

  MESSAGES.push({
    id: 'ai' + Date.now(),
    side: 'npc',
    time: nowTime(),
    kr: kr,
    zh: zh
  });

  isTyping = false;
  render();
}

/* ============================================================
   7. 이벤트 바인딩
   ============================================================ */
document.getElementById('tabKakao').onclick = () => {
  platform = 'kakao';
  document.getElementById('tabKakao').classList.add('on');
  document.getElementById('tabIg').classList.remove('on');
  render();
};

document.getElementById('tabIg').onclick = () => {
  platform = 'ig';
  document.getElementById('tabIg').classList.add('on');
  document.getElementById('tabKakao').classList.remove('on');
  render();
};

document.getElementById('transToggle').onclick = () => {
  showTranslation = !showTranslation;
  localStorage.setItem('showTranslation', showTranslation ? 'on' : 'off');
  render();
};

document.getElementById('send').onclick = send;
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

render();
</script>
</body>
</html>
